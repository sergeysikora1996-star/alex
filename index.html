<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Telegram Style Bot Page">
    <title>AutoReg Bot</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="tg-app">
        <header class="tg-header">
            <div class="header-info">
                <div class="avatar">🤖</div>
                <div class="title-status">
                    <h1>AutoReg Bot</h1>
                    <span class="status">bot</span>
                </div>
            </div>
            <div class="header-actions">
                <span class="icon-menu">⋮</span>
            </div>
        </header>

        <main class="tg-chat">
            <div class="message received">
                <div class="message-content">
                    Привет! Я бот для автоматизации. Чем могу помочь сегодня?
                    <span class="time">10:00</span>
                </div>
            </div>

            <div class="message sent">
                <div class="message-content">
                    Хочу запустить авторег! 🚀
                    <span class="time">10:01<span class="ticks">✓✓</span></span>
                </div>
            </div>

            <div class="message received">
                <div class="message-content">
                    Отлично! Проект сейчас находится в активной разработке. Скоро здесь появится мощный функционал.
                    <span class="time">10:01</span>
                </div>
            </div>

            <div class="center-date">
                <span>Проект загружен на GitHub</span>
            </div>
        </main>

        <footer class="tg-input-area">
            <button class="attach-btn">📎</button>
            <input type="text" placeholder="Написать сообщение..." disabled>
            <button class="send-btn" onclick="alert('Бот пока в разработке!')">➤</button>
        </footer>
    </div>
</body>
</html>
